        // 状态归一化
        function normalizeStatus(status) {
            if (!status || status.trim() === '') return '待处理';
            const s = status.trim();
            if (s === '已解决' || s === '关闭' || s === '已完成') return '已解决';
            if (s === '待处理' || s === '新建' || s === '未开始') return '待处理';
            if (s === '解决中' || s === '处理中') return '处理中';
            return '处理中';
        }

        // 紧急程度归一化
        function normalizeUrgency(urgency) {
            if (!urgency) return '';
            const u = urgency.trim().toUpperCase();
            if (u === '高' || u === 'P0' || u === 'P1') return '高';
            if (u === '中' || u === 'P2') return '中';
            if (u === '低' || u === 'P3' || u === 'P4') return '低';

        async function loadData() {
            renderDashboard(INLINE_DATA);
            try {
                const r = await fetch('./data/procurement_issues.json');
                if (r.ok) {
                    const d = await r.json();
                    if (d.issues && d.issues.length > 0) renderDashboard(d);
                }
            } catch(e) {}
        }

        function renderDashboard(data) {
            const issues = data.issues || [];
            document.getElementById('updateTime').textContent = '更新时间：' + new Date().toLocaleString('zh-CN');

            const total = issues.length;
            const pending = issues.filter(i => normalizeStatus(i.status) === '待处理').length;
            const processing = issues.filter(i => normalizeStatus(i.status) === '处理中').length;
            const resolved = issues.filter(i => normalizeStatus(i.status) === '已解决').length;
            const resolveRate = total > 0 ? ((resolved / total) * 100).toFixed(1) + '%' : '0%';

            document.getElementById('totalCount').textContent = total;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('processingCount').textContent = processing;
            document.getElementById('resolvedCount').textContent = resolved;
            document.getElementById('resolveRate').textContent = resolveRate;

            // 平均处理时长（分钟粒度）
            const resolvedWithTime = issues.filter(i => normalizeStatus(i.status) === '已解决' && i.createTime && i.resolveTime);
            let avgTime = '--';
            if (resolvedWithTime.length > 0) {
                const totalMinutes = resolvedWithTime.reduce((sum, i) => {
                    return sum + (new Date(i.resolveTime) - new Date(i.createTime)) / (1000 * 60);
                }, 0);
                const mins = Math.round(totalMinutes / resolvedWithTime.length);
                if (mins < 60) {
                    avgTime = mins + '分钟';
                } else if (mins < 1440) {
                    const h = Math.floor(mins / 60);
                    const m = mins % 60;
                    avgTime = m > 0 ? h + '小时' + m + '分钟' : h + '小时';
                } else {
                    const d = Math.floor(mins / 1440);
                    const h = Math.round((mins % 1440) / 60);
                    avgTime = h > 0 ? d + '天' + h + '小时' : d + '天';
                }
            }
            document.getElementById('avgTime').textContent = avgTime;

            renderStatusChart(pending, processing, resolved);
            renderTypeChart(issues);
            renderUrgencyChart(issues);
            renderHandlerChart(issues);
            renderTable(issues);
        }

        function renderStatusChart(p, c, r) {
            new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: { labels: ['待处理','处理中','已解决'], datasets: [{ data: [p,c,r], backgroundColor: ['#facc15','#4da3ff','#4ade80'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        function renderTypeChart(issues) {
            const counts = {};
            issues.forEach(i => { counts[i.type] = (counts[i.type] || 0) + 1; });
            new Chart(document.getElementById('typeChart'), {
                type: 'pie',
                data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: ['#4da3ff','#f87171','#4ade80','#facc15','#a78bfa','#fb923c'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        function renderUrgencyChart(issues) {
            const high = issues.filter(i => normalizeUrgency(i.urgency) === '高').length;
            const medium = issues.filter(i => normalizeUrgency(i.urgency) === '中').length;
            const low = issues.filter(i => normalizeUrgency(i.urgency) === '低').length;
            new Chart(document.getElementById('urgencyChart'), {
                type: 'bar',
                data: { labels: ['高','中','低'], datasets: [{ data: [high,medium,low], backgroundColor: ['#f87171','#facc15','#4ade80'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#2a2a3e' }, ticks: { color: '#9494a8' } }, x: { grid: { color: '#2a2a3e' }, ticks: { color: '#9494a8' } } } }
            });
        }

        function renderHandlerChart(issues) {
            const counts = {};
            issues.forEach(i => { if (i.handler) counts[i.handler] = (counts[i.handler] || 0) + 1; });
            const labels = Object.keys(counts);
            new Chart(document.getElementById('handlerChart'), {
                type: 'bar',
                data: { labels: labels.length ? labels : ['暂无数据'], datasets: [{ data: labels.length ? Object.values(counts) : [0], backgroundColor: '#4da3ff', borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, indexAxis: 'y', scales: { x: { beginAtZero: true, grid: { color: '#2a2a3e' }, ticks: { color: '#9494a8' } }, y: { grid: { color: '#2a2a3e' }, ticks: { color: '#9494a8' } } } }
            });
        }

        function renderTable(issues) {
            const tbody = document.getElementById('tableBody');
            if (issues.length === 0) { tbody.innerHTML = '<tr><td colspan="10" class="empty-state">暂无数据</td></tr>'; return; }
            tbody.innerHTML = issues.map(i => {
                const normStatus = normalizeStatus(i.status);
                const statusClass = normStatus === '待处理' ? 'pending' : normStatus === '处理中' ? 'processing' : 'resolved';
                const normUrgency = normalizeUrgency(i.urgency);
                const urgencyClass = normUrgency === '高' ? 'high' : normUrgency === '中' ? 'medium' : 'low';
                const hasSolution = i.solution && i.solution.trim();
                const solutionDisplay = hasSolution
                    ? '<span class="solution-link" onclick="showSolution(\'' + escapeHtml(i.ticketNo||'') + '\',\'' + escapeHtml(i.description||'') + '\',\'' + escapeHtml(i.solution) + '\')">查看</span>'
                    : '--';
                return '<tr><td>' + (i.id||'--') + '</td>' +
                    '<td><span class="solution-link" onclick="showSolution(\'' + escapeHtml(i.ticketNo||'') + '\',\'' + escapeHtml(i.description||'') + '\',\'' + escapeHtml(i.solution||'') + '\')">' + (i.ticketNo||'--') + '</span></td>' +
                    '<td>' + (i.description||'--') + '</td><td>' + (i.type||'--') + '</td>' +
                    '<td><span class="urgency-tag ' + urgencyClass + '">' + (normUrgency||'--') + '</span></td>' +
                    '<td><span class="status-tag ' + statusClass + '">' + (i.status||'--') + '</span></td>' +
                    '<td>' + (i.handler||'--') + '</td>' +
                    '<td>' + (i.createTime ? new Date(i.createTime).toLocaleDateString('zh-CN') : '--') + '</td>' +
                    '<td>' + (i.resolveTime ? new Date(i.resolveTime).toLocaleDateString('zh-CN') : '--') + '</td>' +
                    '<td>' + solutionDisplay + '</td></tr>';
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function showSolution(ticketNo, description, solution) {
            document.getElementById('modalTicketNo').textContent = ticketNo || '--';
            document.getElementById('modalDesc').textContent = description || '--';
            document.getElementById('modalSolution').textContent = solution || '暂无解决方案';
            document.getElementById('solutionModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('solutionModal').classList.remove('active');
        }

        loadData();
    </script>
